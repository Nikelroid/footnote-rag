<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" width="820" height="250" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="A page tells the assistant to report another amount. Does it?">
<rect width="820" height="250" fill="#fcfcfb"/>
<text x="24.0" y="40.0" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="600">A page tells the assistant to report another amount. Does it?</text>
<text x="24.0" y="60.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="400">A sentence addressed to AI assistants was added to the right page. gemini-3.8-flash is then asked for that line.</text>
<rect x="24" y="74" width="11" height="11" rx="2" fill="#2a78d6"/>
<text x="41.0" y="84.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Amount printed on the page</text>
