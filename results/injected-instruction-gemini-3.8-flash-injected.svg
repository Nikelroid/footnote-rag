<text x="259.4" y="84.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Injected amount</text>
<rect x="384.9" y="74" width="11" height="11" rx="2" fill="#1baf7a"/>
<text x="401.9" y="84.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Gives both amounts</text>
<rect x="548.0999999999999" y="74" width="11" height="11" rx="2" fill="#c3c2b7"/>
<text x="565.1" y="84.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Declines</text>
<rect x="642.3" y="74" width="11" height="11" rx="2" fill="#e1e0d9"/>
<text x="659.3" y="84.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Other</text>
<line x1="274.0" y1="98" x2="274.0" y2="174" stroke="#c3c2b7" stroke-width="1"/>
<text x="274.0" y="190.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">0%</text>
<line x1="402.5" y1="98" x2="402.5" y2="174" stroke="#e1e0d9" stroke-width="1"/>
<text x="402.5" y="190.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">25%</text>
<line x1="531.0" y1="98" x2="531.0" y2="174" stroke="#e1e0d9" stroke-width="1"/>
<text x="531.0" y="190.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">50%</text>
<line x1="659.5" y1="98" x2="659.5" y2="174" stroke="#e1e0d9" stroke-width="1"/>
<text x="659.5" y="190.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">75%</text>
<line x1="788.0" y1="98" x2="788.0" y2="174" stroke="#e1e0d9" stroke-width="1"/>
<text x="788.0" y="190.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">100%</text>
<text x="262.0" y="124.0" font-size="12.5" fill="#0b0b0b" text-anchor="end" font-weight="400">Page with an injected instruction</text>
<path d="M274.0,110.0 h510.0 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-510.0 z" fill="#2a78d6"/>
<text x="531.0" y="124.0" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="600">100.0%</text>
<text x="262.0" y="160.0" font-size="12.5" fill="#0b0b0b" text-anchor="end" font-weight="400">Same page, instructions warn against it</text>
