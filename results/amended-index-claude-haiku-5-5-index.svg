<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 286" width="820" height="286" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="After a filing changes, which amount does the whole pipeline give?">
<rect width="820" height="286" fill="#fcfcfb"/>
<text x="24.0" y="40.0" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="600">After a filing changes, which amount does the whole pipeline give?</text>
<text x="24.0" y="60.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="400">The amended filing is in the real index, and the question goes through search. claude-haiku-5-5 is then asked for that line.</text>
<rect x="24" y="74" width="11" height="11" rx="2" fill="#2a78d6"/>
<text x="41.0" y="84.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">New amount</text>
<rect x="132.0" y="74" width="11" height="11" rx="2" fill="#eb6834"/>
<text x="149.0" y="84.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Old amount</text>
<rect x="240.0" y="74" width="11" height="11" rx="2" fill="#1baf7a"/>
<text x="257.0" y="84.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Gives both amounts</text>
<rect x="403.2" y="74" width="11" height="11" rx="2" fill="#c3c2b7"/>
<text x="420.2" y="84.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Declines</text>
<rect x="497.4" y="74" width="11" height="11" rx="2" fill="#e1e0d9"/>
<text x="514.4" y="84.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Other</text>
<line x1="274.0" y1="98" x2="274.0" y2="210" stroke="#c3c2b7" stroke-width="1"/>
<text x="274.0" y="226.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">0%</text>
<line x1="402.5" y1="98" x2="402.5" y2="210" stroke="#e1e0d9" stroke-width="1"/>
<text x="402.5" y="226.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">25%</text>
<line x1="531.0" y1="98" x2="531.0" y2="210" stroke="#e1e0d9" stroke-width="1"/>
<text x="531.0" y="226.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">50%</text>
<line x1="659.5" y1="98" x2="659.5" y2="210" stroke="#e1e0d9" stroke-width="1"/>
<text x="659.5" y="226.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">75%</text>
<line x1="788.0" y1="98" x2="788.0" y2="210" stroke="#e1e0d9" stroke-width="1"/>
<text x="788.0" y="226.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">100%</text>
<text x="262.0" y="124.0" font-size="12.5" fill="#0b0b0b" text-anchor="end" font-weight="400">Old filing replaced (synced)</text>
<rect x="274.0" y="110.0" width="506.8" height="20" fill="#2a78d6"/>
<text x="527.4" y="124.0" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="600">99.0%</text>
<path d="M782.8,110.0 h1.2 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-1.2 z" fill="#eb6834"/>
<text x="262.0" y="160.0" font-size="12.5" fill="#0b0b0b" text-anchor="end" font-weight="400">Amended filing added, old one kept</text>
<rect x="274.0" y="146.0" width="465.3" height="20" fill="#eb6834"/>
<text x="506.6" y="160.0" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="600">90.9%</text>
<rect x="741.3" y="146.0" width="29.2" height="20" fill="#1baf7a"/>
<path d="M772.4,146.0 h11.6 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-11.6 z" fill="#e1e0d9"/>
<text x="262.0" y="196.0" font-size="12.5" fill="#0b0b0b" text-anchor="end" font-weight="400">Both kept, with dates and the rule</text>
<rect x="274.0" y="182.0" width="496.4" height="20" fill="#2a78d6"/>
<text x="522.2" y="196.0" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="600">97.0%</text>
<path d="M772.4,182.0 h11.6 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-11.6 z" fill="#e1e0d9"/>
<text x="24.0" y="252.0" font-size="11.5" fill="#898781" text-anchor="start" font-weight="400">33 statement lines from real filings, each read correctly on its own page first. Three runs per line.</text>
</svg>
