<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" width="820" height="250" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Handed another company's page, what does the assistant answer?">
<rect width="820" height="250" fill="#fcfcfb"/>
<text x="24.0" y="40.0" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="600">Handed another company's page, what does the assistant answer?</text>
<text x="24.0" y="60.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="400">The page comes from another company and has a line with the same name. claude-sonnet-5-5 is then asked for that line.</text>
<rect x="24" y="74" width="11" height="11" rx="2" fill="#2a78d6"/>
<text x="41.0" y="84.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Says it is not there</text>
<rect x="201.0" y="74" width="11" height="11" rx="2" fill="#eb6834"/>
<text x="218.0" y="84.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Other company's amount</text>
<rect x="391.8" y="74" width="11" height="11" rx="2" fill="#1baf7a"/>
<text x="408.8" y="84.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Right amount, from memory</text>
<rect x="603.3" y="74" width="11" height="11" rx="2" fill="#c3c2b7"/>
<text x="620.3" y="84.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Gives both</text>
<rect x="711.3" y="74" width="11" height="11" rx="2" fill="#e1e0d9"/>
<text x="728.3" y="84.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Other</text>
<line x1="274.0" y1="98" x2="274.0" y2="174" stroke="#c3c2b7" stroke-width="1"/>
<text x="274.0" y="190.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">0%</text>
<line x1="402.5" y1="98" x2="402.5" y2="174" stroke="#e1e0d9" stroke-width="1"/>
<text x="402.5" y="190.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">25%</text>
<line x1="531.0" y1="98" x2="531.0" y2="174" stroke="#e1e0d9" stroke-width="1"/>
<text x="531.0" y="190.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">50%</text>
<line x1="659.5" y1="98" x2="659.5" y2="174" stroke="#e1e0d9" stroke-width="1"/>
<text x="659.5" y="190.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">75%</text>
<line x1="788.0" y1="98" x2="788.0" y2="174" stroke="#e1e0d9" stroke-width="1"/>
<text x="788.0" y="190.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">100%</text>
<text x="262.0" y="124.0" font-size="12.5" fill="#0b0b0b" text-anchor="end" font-weight="400">Labelled as the other company's filing</text>
<path d="M274.0,110.0 h510.0 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-510.0 z" fill="#2a78d6"/>
<text x="531.0" y="124.0" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="600">100.0%</text>
<text x="262.0" y="160.0" font-size="12.5" fill="#0b0b0b" text-anchor="end" font-weight="400">Labelled as the filing asked about</text>
<path d="M274.0,146.0 h510.0 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-510.0 z" fill="#eb6834"/>
<text x="531.0" y="160.0" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="600">100.0%</text>
<text x="24.0" y="216.0" font-size="11.5" fill="#898781" text-anchor="start" font-weight="400">83 statement lines from real filings, each read correctly on its own page first. Three runs per line.</text>
</svg>
